apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Values.innResolver.appName }}
  labels:
    app: {{ .Values.innResolver.appName | quote }}
spec:
  type: {{ .Values.innResolver.serviceType | quote}}
  selector:
    app: {{ .Values.innResolver.appName | quote }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.innResolver.containerPort }}
      targetPort: http

    - name: management
      protocol: TCP
      port: {{ .Values.innResolver.actuatorPort }}
      targetPort: management