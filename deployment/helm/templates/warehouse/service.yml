apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Values.warehouse.appName }}
  labels:
    app: {{ .Values.warehouse.appName | quote }}
spec:
  type: {{ .Values.warehouse.serviceType | quote}}
  selector:
    app: {{ .Values.warehouse.appName | quote }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.ingress.port }}
      targetPort: http

    - name: management
      protocol: TCP
      port: {{ .Values.warehouse.actuatorPort }}
      targetPort: management