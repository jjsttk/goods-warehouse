apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Values.accountNumberResolver.appName }}
  labels:
    app: {{ .Values.accountNumberResolver.appName | quote }}
spec:
  type: {{ .Values.accountNumberResolver.serviceType | quote}}
  selector:
    app: {{ .Values.accountNumberResolver.appName | quote }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.accountNumberResolver.containerPort}}
      targetPort: http

    - name: management
      protocol: TCP
      port: {{ .Values.accountNumberResolver.actuatorPort }}
      targetPort: management