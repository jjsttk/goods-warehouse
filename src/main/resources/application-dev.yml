spring:
  datasource:
    url: jdbc:h2:mem:test;INIT=create domain if not exists clob as text;MODE=PostgreSQL;
    username: sa
    password: password

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
      hibernate.temp.use_jdbc_metadata_defaults: true
      hibernate.globally_quoted_identifiers: false
  liquibase:
     enabled: true

  h2:
    console:
      enabled: true
      path: /h2-console
