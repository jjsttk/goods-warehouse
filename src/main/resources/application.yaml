spring:
  application:
    name: goods-warehouse
  profiles:
    default: dev
  liquibase:
    change-log: classpath:db/changelog/main-changelog.xml
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    deserialization:
      fail-on-unknown-properties: false

app:
  mapper:
    type: conversion-service # Choose between: conversion-service, mapstruct

  aspect:
    transactional:
      measure-execution-time: true

  scheduling:
    enabled: false
    period: 60000 # ms
    price-increase-percentage: 10.1
    optimization:
      enabled: false
      exclusive-lock: false
