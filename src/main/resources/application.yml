spring:
  application:
    name: goods-warehouse
  profiles:
    default: dev
  liquibase:
    change-log: classpath:db/changelog/main-changelog.xml
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    deserialization:
      fail-on-unknown-properties: false
  cache:
    cache-names: rates
    type: caffeine
    caffeine:
      spec: maximumSize=159, expiresAfterWrite=1m

logging:
  level:
    root: info
    org.springframework.cache: DEBUG


app:
  mapper:
    type: conversion-service # Choose between: conversion-service, mapstruct

  aspect:
    transactional:
      measure-execution-time: false # Highlighted because the aspect class lacks a @Value annotation for the property. ${} is used.

  scheduling:
    enabled: false
    period: 60000 # ms
    price-increase-percentage: 10.1
    optimization:
      enabled: false
      use-exclusive-lock: true
      output-file-name: scheduling-db-result.log

  exchange-rate-client:
    implementation: real

  exchange-service:
    api:
      host: http://localhost:8088
      currencies:
        path: /api/v1/currencies
    retry-attempts: 3
    fallback-file: backupRates.json
